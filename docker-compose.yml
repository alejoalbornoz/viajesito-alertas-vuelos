name: viajesito

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viajesito}
      POSTGRES_USER: ${POSTGRES_USER:-viajesito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viajesito}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-viajesito}
      POSTGRES_USER: ${POSTGRES_USER:-viajesito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viajesito}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      APP_API_KEY: ${APP_API_KEY:-}
      ALERT_COOLDOWN_HOURS: ${ALERT_COOLDOWN_HOURS:-72}
      ALERT_MIN_IMPROVEMENT_PCT: ${ALERT_MIN_IMPROVEMENT_PCT:-3}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  analyzer:
    build: ./analyzer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-viajesito}:${POSTGRES_PASSWORD:-viajesito}@db:5432/${POSTGRES_DB:-viajesito}
      BACKEND_URL: http://backend:8080
      APP_API_KEY: ${APP_API_KEY:-}
      NOTIFIER: ${NOTIFIER:-backend}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-mock}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      DEAL_THRESHOLD_PCT: ${DEAL_THRESHOLD_PCT:-15}
      MIN_SAVINGS_PCT: ${MIN_SAVINGS_PCT:-5}
      MIN_SAMPLES: ${MIN_SAMPLES:-5}
      ZSCORE_THRESHOLD: ${ZSCORE_THRESHOLD:-2.0}
      RUN_AT: ${RUN_AT:-08:00}
      RUN_ON_START: ${RUN_ON_START:-true}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    command: ["python", "-m", "vigia", "schedule"]

volumes:
  pgdata:
